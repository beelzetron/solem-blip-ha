name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-scope:
    name: Detect release-only bump
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.classify.outputs.release_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          release_only=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ ! "$before" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$before" "$after" | sort)
              expected=(
                "custom_components/solem_blip/manifest.json"
                "pyproject.toml"
                "uv.lock"
              )

              if [[ ${#files[@]} -eq ${#expected[@]} ]]; then
                matches=true
                for index in "${!expected[@]}"; do
                  if [[ "${files[$index]}" != "${expected[$index]}" ]]; then
                    matches=false
                  fi
                done

                if [[ "$matches" == "true" ]] && git diff -U0 "$before" "$after" -- "${expected[@]}" | awk '
                  /^diff --git / || /^index / || /^--- / || /^\+\+\+ / || /^@@ / { next }
                  /^[+-]/ {
                    if ($0 ~ /^[+-][[:space:]]*"version": "[^"]+",?[[:space:]]*$/) next
                    if ($0 ~ /^[+-]version = "[^"]+"[[:space:]]*$/) next
                    bad=1
                  }
                  END { exit bad }
                '; then
                  release_only=true
                fi
              fi
            fi
          fi

          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    needs: release-scope
    if: needs.release-scope.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    needs: release-scope
    if: needs.release-scope.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  python-sanity:
    name: Python and JSON sanity
    runs-on: ubuntu-latest
    needs: release-scope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Compile Python sources
        run: python -m compileall -q custom_components

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/solem_blip/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/solem_blip/strings.json > /dev/null
          python -m json.tool custom_components/solem_blip/icons.json > /dev/null
          python -m json.tool custom_components/solem_blip/translations/en.json > /dev/null

      - name: Verify brand icons exist
        run: |
          test -f custom_components/solem_blip/brand/icon.png
          test -f custom_components/solem_blip/brand/icon@2x.png

  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: release-scope
    if: needs.release-scope.outputs.release_only != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"

      - name: Install locked dependencies
        env:
          UV_PYTHON: "3.14"
        run: uv sync --frozen --extra dev

      - name: Run pytest
        env:
          UV_PYTHON: "3.14"
        run: uv run pytest -v

  mypy:
    name: Run mypy
    runs-on: ubuntu-latest
    needs: release-scope
    if: needs.release-scope.outputs.release_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"

      - name: Install locked dependencies
        env:
          UV_PYTHON: "3.14"
        run: uv sync --frozen --extra dev

      - name: Run mypy
        env:
          UV_PYTHON: "3.14"
        run: uv run mypy custom_components/solem_blip

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.8"

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project -o /tmp/requirements.txt

      - name: Audit locked dependencies (pip-audit)
        run: uvx pip-audit -r /tmp/requirements.txt --require-hashes --strict --format=columns --progress-spinner off

  build:
    name: Build integration artifact
    runs-on: ubuntu-latest
    needs: [release-scope, hassfest, hacs, python-sanity, pytest, mypy]
    if: >
      always() &&
      needs.release-scope.result == 'success' &&
      needs.python-sanity.result == 'success' &&
      (
        needs.release-scope.outputs.release_only == 'true' ||
        (
          needs.hassfest.result == 'success' &&
          needs.hacs.result == 'success' &&
          needs.pytest.result == 'success' &&
          needs.mypy.result == 'success'
        )
      )

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build HACS artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          dist = root / "dist"
          output = dist / "solem-blip-ha.zip"
          component = root / "custom_components" / "solem_blip"
          excluded_names = {".DS_Store", ".coverage"}
          excluded_suffixes = {".pyc"}
          top_level_files = ["hacs.json", "README.md", "LICENSE"]

          dist.mkdir(exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for file_path in sorted(component.rglob("*")):
                  if not file_path.is_file():
                      continue
                  if "__pycache__" in file_path.parts:
                      continue
                  if file_path.name in excluded_names or file_path.suffix in excluded_suffixes:
                      continue
                  archive.write(file_path, file_path.relative_to(root))

              for name in top_level_files:
                  archive.write(root / name, name)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solem-blip-ha
          path: dist/solem-blip-ha.zip
          if-no-files-found: error

  attest-build:
    name: Attest integration artifact
    runs-on: ubuntu-latest
    needs: build
    if: >
      always() &&
      needs.build.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solem-blip-ha
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/solem-blip-ha.zip
