set_program:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solem_blip
    program:
      required: true
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
    name:
      required: true
      selector:
        text:
    cycle:
      default: custom
      selector:
        select:
          options:
            - custom
            - even
            - odd
            - odd_31
            - periodic
    week_days:
      default:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    period_length:
      default: 1
      selector:
        number:
          min: 1
          max: 255
          mode: box
    synchro_day:
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    period_start_date:
      selector:
        date:
    start_times:
      required: true
      selector:
        object:
    station_durations:
      required: true
      selector:
        object:
    inter_station_delay:
      default: 0
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    water_budget:
      default: 100
      selector:
        number:
          min: 0
          max: 65535
          mode: box

refresh_programs:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solem_blip

run_name_read_probe:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solem_blip
    delay:
      default: 5
      selector:
        number:
          min: 0
          max: 120
          mode: box
          unit_of_measurement: seconds
    shape_a_delay:
      default: 0
      description: >-
        If set, runs an extra "shape A-delayed" pass: holds a fresh
        connection, waits this many seconds with no transaction, then reads
        the names. Discriminates a plain post-connect wait from the status
        transaction. Requires "Keep BLE connection between polls".
      selector:
        number:
          min: 0
          max: 120
          mode: box
          unit_of_measurement: seconds

restore_programs:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: solem_blip
